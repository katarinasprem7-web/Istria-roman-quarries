<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roman Quarries of Istria — Database</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f3ee; --panel:#fffdf9; --ink:#2b2722; --muted:#6f675d; --line:#e2dbd0;
  --accent:#8a5a2b; --accent-soft:#f1e6d8; --sea:#dfe9ee; --land:#efe8dc; --land-line:#c9bba5;
  --ok:#3f7a4a; --warn:#a0702a; --bad:#9b3b30; --radius:10px;
  --serif:'Source Serif 4',Georgia,serif; --sans:'Inter',system-ui,-apple-system,Segoe UI,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans)}
a{color:var(--accent)}
button{font:inherit;cursor:pointer}
header{background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.hwrap{max-width:1280px;margin:0 auto;padding:14px 20px 0;display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 24px}
.brand{flex:1 1 320px;padding-bottom:12px}
.brand h1{font:600 22px/1.2 var(--serif);margin:0}
.brand .sub{color:var(--muted);font-size:13px}
nav{display:flex;gap:2px;flex-wrap:wrap}
nav a{padding:10px 14px;text-decoration:none;color:var(--muted);border-bottom:2px solid transparent;font-weight:500;font-size:14px}
nav a.on{color:var(--ink);border-bottom-color:var(--accent)}
main{max-width:1280px;margin:0 auto;padding:20px}
.banner{background:#fff4dc;border:1px solid #ecd49a;border-radius:var(--radius);padding:10px 14px;margin-bottom:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:14px}
.banner.edit{background:#eaf1ea;border-color:#b9d2bd}
.banner .sp{flex:1}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr);gap:18px}
@media(max-width:860px){.grid2{grid-template-columns:1fr}}
h2{font:600 20px/1.25 var(--serif);margin:0 0 12px}
h3{font:600 16px/1.3 var(--serif);margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:13px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 12px;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--bad)}
.btn.sm{padding:3px 9px;font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.filters input,.filters select{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;font:inherit;font-size:14px}
.filters input[type=search]{min-width:220px;flex:1}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--line);padding:8px}
td{border-bottom:1px solid var(--line);padding:8px;vertical-align:top}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--accent-soft)}
.tablewrap{overflow-x:auto}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill.g{background:#e3efe4;color:var(--ok)} .pill.y{background:#f6ecd8;color:var(--warn)} .pill.r{background:#f4e1de;color:var(--bad)} .pill.n{background:#ece9e4;color:var(--muted)}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px 18px;margin:0}
.kv div dt{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.kv div dd{margin:2px 0 0;white-space:pre-wrap}
.section{margin-top:18px}
.sechead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.sechead h3{margin:0;flex:1}
/* map */
.mapbox{position:relative;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--sea);height:620px;touch-action:none}
.mapbox.mini{height:260px}
.mapbox>svg{width:100%;height:100%;display:block;cursor:grab;user-select:none}
.mapbox>svg.drag{cursor:grabbing}
.maplegend svg{display:inline-block;vertical-align:middle}
.mapbox.mini .maplegend{display:none}
.mapctl{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:4px}
.mapctl button{width:32px;height:32px;border:1px solid var(--line);background:#fff;border-radius:6px;font-size:17px;line-height:1}
.maplegend{position:absolute;left:10px;bottom:10px;background:rgba(255,253,249,.94);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px}
.maplegend span{display:inline-flex;align-items:center;gap:6px;margin-right:10px}
.coord{position:absolute;right:10px;bottom:10px;background:rgba(255,253,249,.94);border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:12px;font-variant-numeric:tabular-nums}
.qitem{padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;cursor:pointer;background:#fff}
.qitem:hover,.qitem.sel{border-color:var(--accent);background:var(--accent-soft)}
.qitem b{font-family:var(--serif);font-weight:600}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.gallery figure{margin:0;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.gallery img{width:100%;height:150px;object-fit:cover;display:block;cursor:zoom-in;background:#eee}
.gallery figcaption{padding:6px 8px;font-size:12px}
.empty{color:var(--muted);font-style:italic;font-size:14px}
/* modal */
.modalbg{position:fixed;inset:0;background:rgba(40,32,24,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:100;overflow:auto}
.modal{background:var(--panel);border-radius:12px;max-width:720px;width:100%;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal.wide{max-width:1000px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.form .full{grid-column:1/-1}
@media(max-width:600px){.form{grid-template-columns:1fr}}
.form label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:3px}
.form input,.form select,.form textarea{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:7px;font:inherit;font-size:14px;background:#fff}
.form textarea{min-height:78px;resize:vertical}
.form .help{font-size:12px;color:var(--muted);margin-top:2px}
.err{color:var(--bad);font-size:13px;margin-top:8px}
textarea.code{width:100%;min-height:320px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;border:1px solid var(--line);border-radius:8px;padding:10px}
.lightbox img{max-width:100%;max-height:75vh;display:block;margin:0 auto}
.strat{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start}
.strat svg{flex:0 0 auto}
.strat .tablewrap{flex:1;min-width:300px}
footer{max-width:1280px;margin:0 auto;padding:10px 20px 40px;color:var(--muted);font-size:13px;display:flex;gap:16px;flex-wrap:wrap;align-items:center}
footer .sp{flex:1}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:8px;font-size:14px;z-index:200}
.stat{display:flex;gap:26px;flex-wrap:wrap;margin:6px 0 4px}
.stat div b{display:block;font:600 24px/1.1 var(--serif)}
.stat div span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
</style>
</head>

<script>
"use strict";
/* ============================== VOCABULARIES ============================== */
const V = {
  precision: ['exact','approximate','hidden'],
  status: ['confirmed Roman','probable Roman','presumed','undetermined'],
  qtype: ['quarry face / front','open-cast pit','coastal quarry','underground','outcrop / boulder exploitation','uncertain'],
  preservation: ['good','moderate','poor','destroyed','unknown'],
  toolmark: ['pick marks','punch marks','chisel marks','separation trench','wedge holes','lever sockets','extraction negative (block scar)','extraction steps / benches','unfinished / abandoned block','saw marks','drill holes (modern)','other'],
  dunham: ['','mudstone','wackestone','packstone','grainstone','boundstone','floatstone','rudstone','crystalline carbonate'],
  method: ['thin section (optical microscopy)','cathodoluminescence','SEM-EDS','XRD','XRF','ICP-MS / ICP-OES','stable isotopes (δ13C, δ18O)','Sr isotopes','porosimetry','physical-mechanical tests','micropaleontology','other'],
  media: ['photo','photomicrograph','drawing','plan / section','3D model / orthophoto','other']
};
/* field: [key,label,type,opts]  types: text,textarea,number,select,lines,date */
const F = {
  quarry: [
    ['id','Quarry ID','text',{req:1,help:'Short unique code, e.g. KAN-01'}],
    ['name','Name','text',{req:1}],
    ['toponym','Toponym / local name','text'],
    ['municipality','Municipality','text'],
    ['lat','Latitude (WGS84, decimal °)','number',{step:'any',help:'e.g. 45.1012'}],
    ['lon','Longitude (WGS84, decimal °)','number',{step:'any',help:'e.g. 13.7105'}],
    ['precision','Public location display','select',{list:'precision',help:'exact / approximate (~1 km) / hidden from public'}],
    ['status','Identification','select',{list:'status'}],
    ['type','Quarry type','select',{list:'qtype'}],
    ['period','Period of use','text'],
    ['preservation','State of preservation','select',{list:'preservation'}],
    ['protection','Legal protection / register no.','text'],
    ['lithology','Main lithology','text'],
    ['formation','Formation / unit','text'],
    ['age','Geological age','text'],
    ['documented_by','Documented by','text'],
    ['last_visit','Last field visit','date'],
    ['dating_basis','Dating basis','textarea',{full:1}],
    ['extraction','Extraction technique','textarea',{full:1}],
    ['description','Description','textarea',{full:1}],
    ['bibliography','Bibliography (one reference per line)','lines',{full:1}]
  ],
  toolmark: [
    ['sector','Sector / front','text'],
    ['type','Type','select',{list:'toolmark'}],
    ['tool','Tool (interpreted)','text'],
    ['dimensions','Dimensions','text'],
    ['orientation','Orientation','text'],
    ['notes','Notes','textarea',{full:1}]
  ],
  stratum: [
    ['bed','Bed no.','text',{help:'List beds from bottom to top'}],
    ['thickness_cm','Thickness (cm)','number'],
    ['lithology','Lithology','text'],

    ['bed','Bed','text'],
    ['sector','Sector / front','text'],
    ['date','Collection date','date'],
    ['collector','Collector','text'],
    ['storage','Storage / repository','text'],
    ['description','Description','textarea',{full:1}]
  ],
  analysis: [

    ['location_policy','Location policy','textarea',{full:1}]
  ]
};

/* ============================== STATE ============================== */
const LS_KEY='istria-quarrydb-draft-v1', LS_EDIT='istria-quarrydb-editor';
let DB=null, editor=false, hasDraft=false, source='embedded';
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}},del(k){try{localStorage.removeItem(k)}catch(e){}}};

function normalize(d){
  d=d||{}; d.meta=d.meta||{}; d.quarries=d.quarries||[]; d.samples=d.samples||[]; d.analyses=d.analyses||[];
  d.quarries.forEach(q=>{q.toolmarks=q.toolmarks||[];q.strata=q.strata||[];q.media=q.media||[];
    if(!Array.isArray(q.bibliography)) q.bibliography=q.bibliography?String(q.bibliography).split(/\n/).filter(Boolean):[];
    if(q.lat!==''&&q.lat!=null) q.lat=Number(q.lat); if(q.lon!==''&&q.lon!=null) q.lon=Number(q.lon);
    if(!q.precision) q.precision='approximate';});
  return d;
}
async function load(){
  let base=null;
  try{const r=await fetch('data.json',{cache:'no-store'}); if(r.ok){base=await r.json();source='data.json';}}catch(e){}
  if(!base){try{base=JSON.parse(document.getElementById('embedded-data').textContent);source='embedded';}catch(e){base={};}}
  const draft=ls.get(LS_KEY);
  if(draft){try{DB=normalize(JSON.parse(draft));hasDraft=true;}catch(e){DB=normalize(base);}}
  else DB=normalize(base);
  editor=ls.get(LS_EDIT)==='1';
  route();
}
function save(){
  hasDraft=true;
  if(!ls.set(LS_KEY,JSON.stringify(DB))) toast('Changes kept for this session only — export the data to keep them.');
  route();
}

/* ============================== HELPERS ============================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slug=s=>String(s).replace(/[^A-Za-z0-9-]/g,'-');
const qById=id=>DB.quarries.find(q=>q.id===id);
const sById=id=>DB.samples.find(s=>s.id===id);
const samplesOf=qid=>DB.samples.filter(s=>s.quarry_id===qid);
const analysesOf=sid=>DB.analyses.filter(a=>a.sample_id===sid);
const analysesOfQ=qid=>{const ids=new Set(samplesOf(qid).map(s=>s.id));return DB.analyses.filter(a=>ids.has(a.sample_id));};
const nextId=(arr,prefix)=>{let n=arr.length+1;while(arr.some(x=>x.id===prefix+n))n++;return prefix+n;};
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2600);}
function statusPill(s){const c={'confirmed Roman':'g','probable Roman':'y','presumed':'n','undetermined':'n'}[s]||'n';return s?`<span class="pill ${c}">${esc(s)}</span>`:'';}
function precPill(p){const c={exact:'g',approximate:'y',hidden:'r'}[p]||'n';return `<span class="pill ${c}">${esc(p||'—')}</span>`;}
/* public coordinates */
function pubCoord(q){
  if(q.lat==null||q.lon==null||isNaN(q.lat)||isNaN(q.lon)||q.lat===''||q.lon==='') return null;
  if(editor) return {lat:q.lat,lon:q.lon,approx:q.precision==='approximate',hidden:q.precision==='hidden'};
  if(q.precision==='hidden') return null;
  if(q.precision==='approximate') return {lat:Math.round(q.lat*100)/100,lon:Math.round(q.lon*100)/100,approx:true};
  return {lat:q.lat,lon:q.lon};
}
function coordText(q){
  const c=pubCoord(q);
  if(!c) return q.precision==='hidden'?'Withheld (available on request)':'—';
  const f=c.approx&&!editor?2:5;
  return `${c.lat.toFixed(f)}° N, ${c.lon.toFixed(f)}° E${c.approx&&!editor?' (generalised ≈1 km)':''}${editor&&q.precision!=='exact'?' · public: '+q.precision:''}`;
}

/* ============================== MAP ============================== */
const ISTRIA=[[13.50,45.50],[13.53,45.43],[13.55,45.36],[13.57,45.31],[13.59,45.23],[13.60,45.16],[13.62,45.135],[13.63,45.10],[13.63,45.07],[13.67,45.02],[13.73,44.97],[13.79,44.93],[13.82,44.88],[13.85,44.86],[13.89,44.80],[13.91,44.77],[13.94,44.80],[13.98,44.82],[14.00,44.86],[14.03,44.90],[14.06,44.94],[14.07,45.02],[14.10,44.98],[14.13,45.04],[14.16,45.08],[14.19,45.13],[14.24,45.15],[14.27,45.22],[14.30,45.30],[14.31,45.34],[14.37,45.35],[14.44,45.34],[14.48,45.42],[14.40,45.48],[14.20,45.52],[14.00,45.50],[13.90,45.47],[13.75,45.48],[13.62,45.47],[13.50,45.50]];
const TOWNS=[['Pula',44.866,13.850],['Poreč',45.227,13.594],['Rovinj',45.081,13.639],['Umag',45.434,13.520],['Labin',45.095,14.120],['Pazin',45.240,13.937],['Buzet',45.408,13.967],['Novigrad',45.317,13.562]];
const K=1000, COS=Math.cos(45.15*Math.PI/180), LON0=13.35, LAT0=45.62;
const px=lon=>(lon-LON0)*K*COS, py=lat=>(LAT0-lat)*K;
const inv=(x,y)=>({lon:x/(K*COS)+LON0,lat:LAT0-y/K});
const VB0={x:0,y:0,w:820,h:900};

function mapSVG(quarries,opts){
  opts=opts||{};
  const pts=ISTRIA.map(([lo,la])=>px(lo).toFixed(1)+','+py(la).toFixed(1)).join(' ');
  let grat='';
  for(let lo=13.4;lo<=14.6;lo+=0.2){grat+=`<line x1="${px(lo)}" y1="-200" x2="${px(lo)}" y2="1200" class="g"/>`;}
  for(let la=44.6;la<=45.8;la+=0.1){grat+=`<line x1="-200" y1="${py(la)}" x2="1200" y2="${py(la)}" class="g"/>`;}
  return `<svg viewBox="0 0 820 900" preserveAspectRatio="xMidYMid meet">
  <style>.g{stroke:#c7d6dd;stroke-width:.6;vector-effect:non-scaling-stroke}.town circle{fill:#8c8479}.town text{font-family:Inter,sans-serif;fill:#7b7266;paint-order:stroke;stroke:#efe8dc}
  .mk{cursor:pointer}.mk:hover .dot{stroke:#2b2722}</style>
  <g class="grat">${grat}</g>
  <polygon points="${pts}" fill="var(--land)" stroke="var(--land-line)" stroke-width="1.2" vector-effect="non-scaling-stroke"/>
  <g class="towns"></g>
  <g class="markers"></g></svg>`;
}
function initMap(box,quarries,opts){
  opts=opts||{};
  box.innerHTML=mapSVG()+`<div class="mapctl"><button data-z="in" title="Zoom in">+</button><button data-z="out" title="Zoom out">−</button><button data-z="fit" title="Reset view">⤢</button></div>
  <div class="maplegend"><span><svg width="12" height="12"><circle cx="6" cy="6" r="5" fill="#8a5a2b"/></svg>exact</span><span><svg width="14" height="14"><circle cx="7" cy="7" r="6" fill="#c9a26b" fill-opacity=".5" stroke="#a0702a" stroke-dasharray="2 2"/></svg>generalised ≈1 km</span>${editor?'<span><svg width="12" height="12"><circle cx="6" cy="6" r="5" fill="#fff" stroke="#9b3b30" stroke-width="2"/></svg>hidden (editor only)</span>':''}<br><span class="muted">Outline approximate · not for navigation</span></div>
  <div class="coord" style="display:none"></div>`;
  const svg=box.querySelector('svg'), mg=svg.querySelector('.markers'), tg=svg.querySelector('.towns'), coordEl=box.querySelector('.coord');
  let vb={...VB0};
  if(opts.focus){const w=180,h=200;vb={x:px(opts.focus.lon)-w/2,y:py(opts.focus.lat)-h/2,w,h};}
  const apply=()=>{svg.setAttribute('viewBox',`${vb.x} ${vb.y} ${vb.w} ${vb.h}`);draw();};
  const scale=()=>{const r=svg.getBoundingClientRect();return Math.max(vb.w/(r.width||820),vb.h/(r.height||900));};
  function draw(){
    const s=scale();let h='';
    tg.innerHTML=TOWNS.map(([n,la,lo])=>`<g class="town"><circle cx="${px(lo)}" cy="${py(la)}" r="${2.5*s}"/><text x="${px(lo)+5*s}" y="${py(la)+4*s}" font-size="${11*s}" stroke-width="${3*s}">${n}</text></g>`).join('');
    quarries.forEach(q=>{const c=pubCoord(q);if(!c)return;const x=px(c.lon),y=py(c.lat);const sel=opts.selected===q.id;
      if(c.hidden){h+=`<g class="mk" data-id="${esc(q.id)}"><circle class="dot" cx="${x}" cy="${y}" r="${6*s}" fill="#fff" stroke="#9b3b30" stroke-width="${2*s}"/></g>`;}
      else if(c.approx&&!editor){h+=`<g class="mk" data-id="${esc(q.id)}"><circle cx="${x}" cy="${y}" r="${Math.max(9*s,1000/111*K/1000*0.9)}" fill="#c9a26b" fill-opacity=".35" stroke="#a0702a" stroke-width="${1.2*s}" stroke-dasharray="${3*s} ${3*s}"/><circle class="dot" cx="${x}" cy="${y}" r="${3*s}" fill="#a0702a"/></g>`;}
      else {h+=`<g class="mk" data-id="${esc(q.id)}"><circle class="dot" cx="${x}" cy="${y}" r="${(sel?8:6)*s}" fill="${c.approx?'#c9a26b':'#8a5a2b'}" stroke="#fff" stroke-width="${1.5*s}"/></g>`;}
      if(sel||opts.labels){h+=`<text x="${x+9*s}" y="${y+4*s}" style="font:600 ${12*s}px Inter,sans-serif;fill:#2b2722;paint-order:stroke;stroke:#fffdf9;stroke-width:${3*s}px">${esc(q.name)}</text>`;}
    });
    mg.innerHTML=h;
  }
  function zoom(f,cx,cy){const nw=Math.min(Math.max(vb.w*f,20),1600),k=nw/vb.w;if(cx==null){cx=vb.x+vb.w/2;cy=vb.y+vb.h/2;}vb={x:cx-(cx-vb.x)*k,y:cy-(cy-vb.y)*k,w:nw,h:vb.h*k};apply();}
  function toSvg(e){const r=svg.getBoundingClientRect(),s=scale();const ox=(r.width*s-vb.w)/2,oy=(r.height*s-vb.h)/2;return {x:vb.x-ox+(e.clientX-r.left)*s,y:vb.y-oy+(e.clientY-r.top)*s};}
  box.querySelector('.mapctl').onclick=e=>{const z=e.target.dataset.z;if(z==='in')zoom(.6);if(z==='out')zoom(1/.6);if(z==='fit'){vb={...VB0};apply();}};
  svg.addEventListener('wheel',e=>{e.preventDefault();const p=toSvg(e);zoom(e.deltaY<0?.8:1.25,p.x,p.y);},{passive:false});
  let drag=null,moved=false;
  svg.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,vb:{...vb}};moved=false;svg.setPointerCapture(e.pointerId);svg.classList.add('drag');});
  svg.addEventListener('pointermove',e=>{
    if(editor){const p=toSvg(e),g=inv(p.x,p.y);coordEl.style.display='';coordEl.textContent=`${g.lat.toFixed(5)}° N, ${g.lon.toFixed(5)}° E`;}
    if(!drag)return;const s=scale(),dx=(e.clientX-drag.x)*s,dy=(e.clientY-drag.y)*s;if(Math.abs(dx)+Math.abs(dy)>3*s)moved=true;vb={...drag.vb,x:drag.vb.x-dx,y:drag.vb.y-dy};svg.setAttribute('viewBox',`${vb.x} ${vb.y} ${vb.w} ${vb.h}`);});
  const end=e=>{if(!drag)return;svg.classList.remove('drag');const wasMoved=moved;drag=null;
    if(!wasMoved){const t=document.elementFromPoint(e.clientX,e.clientY);const mk=t&&t.closest&&t.closest('.mk');if(mk&&opts.onPick)opts.onPick(mk.dataset.id);}};
  svg.addEventListener('pointerup',end);svg.addEventListener('pointercancel',()=>{drag=null;svg.classList.remove('drag');});
  apply();
  new ResizeObserver(()=>draw()).observe(box);
  return {setSelected(id){opts.selected=id;draw();},focus(q){const c=pubCoord(q);if(!c)return;vb={x:px(c.lon)-vb.w/2,y:py(c.lat)-vb.h/2,w:vb.w,h:vb.h};apply();}};
}

/* ============================== FILTERS ============================== */
const filt={q:'',muni:'',tm:'',dun:'',status:'',hasA:false};
function filteredQuarries(){
  const t=filt.q.trim().toLowerCase();
  return DB.quarries.filter(q=>{
    if(filt.muni&&q.municipality!==filt.muni)return false;
    if(filt.status&&q.status!==filt.status)return false;
    if(filt.tm&&!q.toolmarks.some(m=>m.type===filt.tm))return false;
    if(filt.dun&&!q.strata.some(s=>s.dunham===filt.dun)&&!analysesOfQ(q.id).some(a=>a.dunham===filt.dun))return false;
    if(filt.hasA&&!analysesOfQ(q.id).length)return false;
    if(t){const hay=[q.id,q.name,q.toponym,q.municipality,q.lithology,q.formation,q.age,q.description,q.period].join(' ').toLowerCase();if(!hay.includes(t))return false;}
    return true;});
}
function uniq(a){return [...new Set(a.filter(Boolean))].sort((x,y)=>x.localeCompare(y));}
function filterBar(){
  const opt=(list,val,all)=>`<option value="">${all}</option>`+list.map(v=>`<option${v===val?' selected':''}>${esc(v)}</option>`).join('');
  return `<div class="filters">
   <input type="search" id="fq" placeholder="Search name, toponym, lithology, age…" value="${esc(filt.q)}">
   <select id="fm">${opt(uniq(DB.quarries.map(q=>q.municipality)),filt.muni,'All municipalities')}</select>
   <select id="fs">${opt(V.status,filt.status,'Any identification')}</select>
   <select id="ft">${opt(V.toolmark,filt.tm,'Any tool mark')}</select>
   <select id="fd">${opt(V.dunham.filter(Boolean),filt.dun,'Any texture')}</select>
   <label class="row small"><input type="checkbox" id="fa"${filt.hasA?' checked':''}> with analyses</label>
  </div>`;
}
function bindFilters(onChange){
  const b=(id,k,ev,get)=>{const el=$(id);if(el)el.addEventListener(ev,()=>{filt[k]=get(el);onChange();});};
  b('#fq','q','input',e=>e.value);b('#fm','muni','change',e=>e.value);b('#fs','status','change',e=>e.value);
  b('#ft','tm','change',e=>e.value);b('#fd','dun','change',e=>e.value);b('#fa','hasA','change',e=>e.checked);
}

}

function stratColumn(strata){
  if(!strata.length) return '';
  const W={'':40,mudstone:30,wackestone:42,packstone:54,grainstone:66,boundstone:74,floatstone:70,rudstone:78,'crystalline carbonate':50};
  const tot=strata.reduce((s,b)=>s+(Number(b.thickness_cm)||20),0);const H=Math.min(Math.max(tot*1.1,160),520),k=H/tot;
  let y=H+10,h='';
  strata.forEach((b,i)=>{const t=(Number(b.thickness_cm)||20)*k;y-=t;const w=W[b.dunham||'']||40;
    h+=`<rect x="40" y="${y}" width="${w}" height="${t}" fill="url(#lst)" stroke="#6f5b44" stroke-width="1"/><text x="34" y="${y+t/2+4}" text-anchor="end" font-size="11" fill="#6f675d">${esc(b.bed||i+1)}</text>`;});
  const ticks=['M','W','P','G','B'].map((l,i)=>`<text x="${40+[30,42,54,66,78][i]}" y="${H+26}" font-size="9" text-anchor="middle" fill="#6f675d">${l}</text>`).join('');
  return `<svg width="140" height="${H+34}" viewBox="0 0 140 ${H+34}"><defs><pattern id="lst" width="16" height="8" patternUnits="userSpaceOnUse"><rect width="16" height="8" fill="#e9dfcd"/><path d="M0 0H16M0 4H16M4 0V4M12 4V8" stroke="#b6a587" stroke-width=".7"/></pattern></defs>${h}<line x1="40" y1="${H+12}" x2="122" y2="${H+12}" stroke="#6f675d"/>${ticks}<text x="40" y="8" font-size="9" fill="#6f675d">${Math.round(tot)} cm total</text></svg>`;
}

function readFile(f,cb){if(!f)return;const r=new FileReader();r.onload=()=>cb(r.result);r.readAsText(f);}
function publicCopy(){
  const d=JSON.parse(JSON.stringify(DB));const was=editor;editor=false;
  d.quarries.forEach(q=>{const c=pubCoord(q);q.lat=c?c.lat:null;q.lon=c?c.lon:null;});editor=was;return d;}
function csv(rows,cols){const e=v=>{v=v==null?'':Array.isArray(v)?v.join(' | '):String(v);return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};return '﻿'+cols.join(',')+'\n'+rows.map(r=>cols.map(c=>e(r[c])).join(',')).join('\n');}
const QCOLS=F.quarry.map(f=>f[0]);
function tableCSV(t,pub){
  const d=pub?publicCopy():DB;
  if(t==='quarries') return csv(d.quarries,QCOLS);
  if(t==='toolmarks') return csv(d.quarries.flatMap(q=>q.toolmarks.map(m=>({quarry_id:q.id,...m}))),['quarry_id','id',...F.toolmark.map(f=>f[0])]);
  if(t==='strata') return csv(d.quarries.flatMap(q=>q.strata.map(m=>({quarry_id:q.id,...m}))),['quarry_id','id',...F.stratum.map(f=>f[0])]);
  if(t==='samples') return csv(d.samples,F.sample.map(f=>f[0]));
  if(t==='analyses') return csv(d.analyses,F.analysis.map(f=>f[0]));
}
function offerFile(name,text,mime){
  let ok=false;
  try{const b=new Blob([text],{type:mime});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);ok=true;}catch(e){}
  const big=text.length>400000;
  modal(`<h3>${esc(name)}</h3><p class="small muted">If the download didn't start (some previews block downloads), copy the content below and save it as <code>${esc(name)}</code>.</p>
   <textarea class="code" readonly>${esc(big?text.slice(0,400000)+'\n… (truncated in preview — use the download, or Copy which copies everything)':text)}</textarea>
   <div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn" data-copy>Copy all</button><button class="btn pri" data-close>Done</button></div>`,'wide');
  $('#modalRoot [data-copy]').onclick=async()=>{try{await navigator.clipboard.writeText(text);toast('Copied');}catch(e){const ta=$('#modalRoot textarea');ta.select();toast('Press Ctrl/Cmd+C to copy');}};
}
function parseCSV(t){
  t=t.replace(/^﻿/,'');const rows=[];let row=[],f='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
    else if(c==='"')q=true; else if(c===','){row.push(f);f='';} else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f='';} else f+=c;}
  if(f!==''||row.length){row.push(f);rows.push(row);}
  const h=(rows.shift()||[]).map(x=>x.trim());
  return rows.filter(r=>r.some(x=>x!=='')).map(r=>Object.fromEntries(h.map((k,i)=>[k,r[i]==null?'':r[i]])));
}
function importCSV(text,fname){
  const rows=parseCSV(text);if(!rows.length){toast('CSV is empty');return;}
  let t=(rows[0].table||fname.replace(/\.csv$/i,'').split(/[\\/]/).pop()).toLowerCase();
  t=['quarries','toolmarks','strata','samples','analyses'].find(x=>t.includes(x)||t.includes(x.replace(/s$/,'')))||t;
  let n=0;
  const upsert=(arr,r)=>{const i=arr.findIndex(x=>x.id===r.id);if(i>=0)arr[i]={...arr[i],...r};else arr.push(r);n++;};
  if(t==='quarries'){rows.forEach(r=>{if(!r.id)return;const o={};QCOLS.forEach(k=>{if(k in r)o[k]=r[k];});o.id=r.id;
      if('bibliography' in o)o.bibliography=String(o.bibliography).split(/\s*\|\s*|\n/).filter(Boolean);
      const ex=qById(r.id);if(ex){Object.assign(ex,o);n++;}else{DB.quarries.push({toolmarks:[],strata:[],media:[],...o});n++;}});}
  else if(t==='toolmarks'||t==='strata'){const key=t==='strata'?'strata':'toolmarks';const miss=new Set();
    rows.forEach(r=>{const q=qById(r.quarry_id);if(!q){miss.add(r.quarry_id);return;}const o={...r};delete o.quarry_id;delete o.table;if(!o.id)o.id=nextId(q[key],key==='strata'?'L-':'TM-');upsert(q[key],o);});
    if(miss.size)toast('Skipped rows for unknown quarries: '+[...miss].join(', '));}
  else if(t==='samples'){rows.forEach(r=>{if(!r.id)return;const o={...r};delete o.table;upsert(DB.samples,o);});}
  else if(t==='analyses'){rows.forEach(r=>{if(!r.id)return;const o={...r};delete o.table;upsert(DB.analyses,o);});}
  else {toast('Could not tell which table this CSV is. Name it e.g. samples.csv');return;}
  DB=normalize(DB);save();toast(`Imported ${n} rows into ${t}`);
}

function resizeImage(file,cb){const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const M=1600,s=Math.min(1,M/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.82));};img.onerror=()=>toast('Could not read image');img.src=r.result;};r.readAsDataURL(file);}

  'add-quarry':()=>openForm('New quarry',F.quarry,{precision:'approximate',status:'presumed'},o=>{if(qById(o.id))return 'That ID already exists.';DB.quarries.push({...o,toolmarks:[],strata:[],media:[]});setTimeout(()=>location.hash='#q-'+slug(o.id));}),
  'edit-quarry':()=>{const q=window.__q,old=q.id;openForm('Edit quarry',F.quarry,q,o=>{if(o.id!==old&&qById(o.id))return 'That ID already exists.';Object.assign(q,o);if(o.id!==old){DB.samples.forEach(s=>{if(s.quarry_id===old)s.quarry_id=o.id;});setTimeout(()=>location.hash='#q-'+slug(o.id));}});},
  'del-quarry':()=>{const q=window.__q;const nS=samplesOf(q.id).length;confirmBox(`Delete ${q.name} with its tool marks, beds and media${nS?`, and its ${nS} samples and their analyses`:''}?`,()=>{const sids=new Set(samplesOf(q.id).map(s=>s.id));DB.analyses=DB.analyses.filter(a=>!sids.has(a.sample_id));DB.samples=DB.samples.filter(s=>s.quarry_id!==q.id);DB.quarries=DB.quarries.filter(x=>x!==q);location.hash='#quarries';});},
  'add-toolmark':()=>{const q=window.__q;openForm('New tool mark',F.toolmark,{},o=>{q.toolmarks.push({id:nextId(q.toolmarks,'TM-'),...o});});},
  'edit-toolmark':b=>{const q=window.__q,m=q.toolmarks.find(x=>x.id===b.dataset.id);openForm('Edit tool mark',F.toolmark,m,o=>{Object.assign(m,o);});},
  'del-toolmark':b=>{const q=window.__q;confirmBox('Delete this tool-mark record?',()=>{q.toolmarks=q.toolmarks.filter(x=>x.id!==b.dataset.id);});},
  'add-stratum':()=>{const q=window.__q;openForm('New bed (added on top)',F.stratum,{bed:String(q.strata.length+1)},o=>{q.strata.push({id:nextId(q.strata,'L-'),...o});});},
  'edit-stratum':b=>{const q=window.__q,m=q.strata.find(x=>x.id===b.dataset.id);openForm('Edit bed',F.stratum,m,o=>{Object.assign(m,o);});},
  'del-stratum':b=>{const q=window.__q;confirmBox('Delete this bed?',()=>{q.strata=q.strata.filter(x=>x.id!==b.dataset.id);});},
  'add-sample':()=>{if(!DB.quarries.length){toast('Add a quarry first');return;}const q=location.hash.startsWith('#q-')?window.__q:null;openForm('New sample',F.sample,{id:nextId(DB.samples,'S-'),quarry_id:q?q.id:''},o=>{if(sById(o.id))return 'That sample ID already exists.';DB.samples.push(o);});},
  'edit-sample':b=>{const s=sById(b.dataset.id),old=s.id;openForm('Edit sample',F.sample,s,o=>{if(o.id!==old&&sById(o.id))return 'That sample ID already exists.';Object.assign(s,o);if(o.id!==old)DB.analyses.forEach(a=>{if(a.sample_id===old)a.sample_id=o.id;});});},
  'del-sample':b=>{const n=analysesOf(b.dataset.id).length;confirmBox(`Delete sample ${b.dataset.id}${n?` and its ${n} analyses`:''}?`,()=>{DB.samples=DB.samples.filter(s=>s.id!==b.dataset.id);DB.analyses=DB.analyses.filter(a=>a.sample_id!==b.dataset.id);});},
  'add-analysis':b=>openForm('New analysis',F.analysis,{id:nextId(DB.analyses,'A-'),sample_id:b.dataset.id},o=>{if(DB.analyses.some(a=>a.id===o.id))return 'That analysis ID already exists.';DB.analyses.push(o);}),
  'edit-analysis':b=>{const a=DB.analyses.find(x=>x.id===b.dataset.id),old=a.id;openForm('Edit analysis',F.analysis,a,o=>{if(o.id!==old&&DB.analyses.some(x=>x.id===o.id))return 'That analysis ID already exists.';Object.assign(a,o);});},
  'del-analysis':b=>confirmBox(`Delete analysis ${b.dataset.id}?`,()=>{DB.analyses=DB.analyses.filter(a=>a.id!==b.dataset.id);}),
  'add-media':()=>mediaForm(null),
  'edit-media':b=>mediaForm(window.__q.media.find(m=>m.id===b.dataset.id)),
  'del-media':b=>{const q=window.__q;confirmBox('Delete this image record?',()=>{q.media=q.media.filter(m=>m.id!==b.dataset.id);});}
};
function mediaForm(m){
  const q=window.__q;let uploaded=null;const obj=m?{...m,src:m.src&&m.src.startsWith('data:')?'':m.src}:{license:DB.meta.license||'CC BY 4.0',kind:'photo'};
  openForm(m?'Edit image':'New image',F.media,obj,o=>{const src=uploaded||o.src||(m&&m.src)||'';if(!src)return 'Upload an image or give a file path.';
    if(m)Object.assign(m,o,{src});else q.media.push({id:nextId(q.media,'M-'),...o,src});},
    `<div class="full"><label>Upload image (resized to max 1600 px)</label><input type="file" accept="image/*" id="mup"><div class="help" id="mupst">${m&&m.src&&m.src.startsWith('data:')?'An embedded image is already stored. Upload a new one to replace it.':''}</div></div>`);
  $('#mup').onchange=e=>{const f=e.target.files[0];if(!f)return;$('#mupst').textContent='Processing…';resizeImage(f,d=>{uploaded=d;$('#mupst').textContent=`Ready (${Math.round(d.length*0.75/1024)} KB).`;});};
}

/* ============================== ROUTER ============================== */
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]');if(a){e.preventDefault();const f=ACTIONS[a.dataset.act];if(f)f(a);return;}
  const tr=e.target.closest('tr[data-href]');if(tr&&tr.dataset.href&&!e.target.closest('a,button'))location.hash=tr.dataset.href;
});
$('#editToggle').onclick=()=>{editor=!editor;ls.set(LS_EDIT,editor?'1':'0');route();};
function route(){
  if(!DB)return;
  const h=(location.hash||'#map').slice(1);
  const m=DB.meta;$('#siteTitle').textContent=m.short_title||m.title||'Roman Quarries of Istria';
  $('#siteSub').textContent=(m.title&&m.short_title?'Geological and petrographic database':'')+(m.version?` · v${m.version}`:'');
  $('#footCite').textContent=`${m.license||''}${m.authors?' · '+m.authors:''}${m.doi?' · doi:'+m.doi.replace(/^https?:\/\/doi.org\//,''):''}`;
  $('#editToggle').textContent=editor?'Leave editor mode':'Editor mode';
  const v=h.startsWith('q-')?'quarries':h;
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.v===v));
  if(h.startsWith('q-')) viewQuarry(h.slice(2));
  else if(h==='quarries') viewQuarries();
  else if(h==='samples') viewSamples();
  else if(h==='analyses') viewAnalyses();
  else if(h==='about') viewAbout();
  else viewMap();
}
window.addEventListener('hashchange',()=>{route();window.scrollTo(0,0);});
load();
</script>
</body>
</html>
